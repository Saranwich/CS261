services:
  frontend-dev:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      target: development
    ports:
      - "5173:5173"
    environment:
      CHOKIDAR_USEPOLLING: "true"
      API_PROXY_TARGET: http://backend-dev:8080
      VITE_USE_MOCK: ${VITE_USE_MOCK:-true}
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    profiles:
      - dev
      - fe-dev

  frontend-prod:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      target: production
    environment:
      API_PROXY_TARGET: http://backend-prod:8080
    ports:
      - "80:80"
    profiles:
      - prod
      - fe-prod

  mysql:
    image : mysql:8.4
    ports:
    - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    volumes:
      - mysql_data:/var/lib/mysql
    # ping ผ่าน TCP (127.0.0.1) ไม่ใช่ socket: ตอนเครื่องเปล่า MySQL เปิด server ชั่วคราวที่ไม่รับ TCP ก่อน
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 3s
      timeout: 3s
      retries: 30
    profiles:
      - dev
      - be-dev
      - prod
      - be-prod

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    profiles: 
      - dev
      - be-dev
      - prod
      - be-prod
  
  backend-dev:
    build:
      context: .
      dockerfile: Dockerfile.backend
      target: development
    ports:
      - "8080:8080"
    environment:
      DB_HOST: mysql
      REDIS_HOST: redis
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TU_API_KEY: ${TU_API_KEY}
    volumes:
      - ./backend/src:/app/src
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    profiles:
      - dev
      - be-dev

  backend-prod:
    build:
      context: .
      dockerfile: Dockerfile.backend
      target: production
    ports:
      - "8080:8080"
    environment:
      DB_HOST: mysql
      REDIS_HOST: redis
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TU_API_KEY: ${TU_API_KEY}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    profiles:
      - prod
      - be-prod

volumes:
  frontend_node_modules:
  mysql_data: