services:
  frontend-dev:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      target: development
    ports:
      - "5173:5173"
    environment:
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    profiles:
      - dev

  frontend-prod:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      target: production
    ports:
      - "8080:80"
    profiles:
      - prod

volumes:
  frontend_node_modules: